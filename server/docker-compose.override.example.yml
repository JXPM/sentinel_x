# Exemple : copier en docker-compose.override.yml (non suivi par Git) et mettre les vrais mots de passe
# (ceux créés avec mosquitto_passwd dans server/mosquitto/config/passwd).
services:
  api:
    environment:
      MQTT_USER: api
      MQTT_PASS: "a-remplacer"
      DATABASE_URL: "postgresql://sentinel:mot-de-passe-postgres@postgres:5432/sentinel"
      # Connexion au dashboard : python3 -m app.auth "mot de passe" donne l'empreinte
      DASHBOARD_USER: sentinel
      DASHBOARD_PASS_HASH: "pbkdf2_sha256:310000:a-generer:a-generer"
      SESSION_SECRET: "a-generer-avec-openssl-rand-hex-32"
  postgres:
    environment:
      POSTGRES_PASSWORD: "mot-de-passe-postgres"
  vision:
    environment:
      MQTT_USER: vision
      MQTT_PASS: "a-remplacer"
