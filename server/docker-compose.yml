services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosq-data:/mosquitto/data

  api:
    build:
      context: ..
      dockerfile: server/api.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto

volumes:
  mosq-data:
