services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosq-data:/mosquitto/data

  api:
    build:
      context: ..
      dockerfile: server/api.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # DATABASE_URL (avec le mot de passe) est dans docker-compose.override.yml, hors Git
    depends_on:
      - mosquitto
      - postgres

  anomaly:
    build:
      context: ..
      dockerfile: server/anomaly.Dockerfile
    restart: unless-stopped
    # Lit GET /api/v1/telemetry et poste ses alertes sur l'API, par le réseau Docker interne
    environment:
      SENTINEL_API_URL: http://api:8000
      DEV: edge01
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Aucun port publié : la base n'est joignable que par l'API, sur le réseau Docker interne.
    # POSTGRES_PASSWORD est dans docker-compose.override.yml, hors Git.
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ..
      dockerfile: server/dashboard.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  vision:
    build:
      context: ..
      dockerfile: server/vision.Dockerfile
    restart: unless-stopped
    # Webcam C270 passée à WSL par usbipd (/dev/video0). /dev entier pour la retrouver
    # si elle est rebranchée ; la règle n'autorise que les caméras (majeur 81).
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"
    depends_on:
      - mosquitto

volumes:
  mosq-data:
  pg-data:
