services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosq-data:/mosquitto/data

  api:
    build:
      context: ..
      dockerfile: server/api.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mosquitto

  dashboard:
    build:
      context: ..
      dockerfile: server/dashboard.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  vision:
    build:
      context: ..
      dockerfile: server/vision.Dockerfile
    restart: unless-stopped
    # Webcam C270 passée à WSL par usbipd (/dev/video0). /dev entier pour la retrouver
    # si elle est rebranchée ; la règle n'autorise que les caméras (majeur 81).
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"
    depends_on:
      - mosquitto

volumes:
  mosq-data:
