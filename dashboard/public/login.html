<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Sentinel-X</title>
<link rel="icon" href="/logo-serpent.svg" type="image/svg+xml">
<style>
  /* Charte Sentinel-X : fond #0F0F18, surfaces #171723 / #1F1F2E / #2A2A3D, accent unique #827AFF, critique #FF5C7A */
  @font-face { font-family: "Montserrat"; font-weight: 800; src: url(/fonts/montserrat-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plex Sans"; font-weight: 400; src: url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plex Sans"; font-weight: 500; src: url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plex Sans"; font-weight: 600; src: url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plex Mono"; font-weight: 500; src: url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
  :root { --bg:#0F0F18; --s1:#171723; --s2:#1F1F2E; --s3:#2A2A3D; --t1:#ECEBFF; --t2:#A9A7C9; --t3:#8E8CAE; --v:#827AFF; --v3:#9C95FF; --crit:#FF5C7A; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--t1); font-family: "Plex Sans", system-ui, sans-serif; }
  body::before { content: ""; position: fixed; left: 50%; top: 42%; width: 720px; height: 720px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(130,122,255,.16) 0%, rgba(130,122,255,0) 65%); pointer-events: none; }
  main { position: relative; width: 100%; max-width: 400px; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 28px; text-align: center; }
  .brand img { width: 72px; height: 73px; }
  .brand h1 { margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--t2); font-size: 15px; }
  form { background: var(--s1); border: 1px solid var(--s3); border-radius: 16px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 18px; }
  .kick { font-family: "Plex Mono", monospace; font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--t3); }
  label { display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500; color: var(--t2); }
  input { height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--s3); background: var(--s2); color: var(--t1); font: 500 16px "Plex Sans", sans-serif; transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); }
  input:focus { outline: none; border-color: var(--v); box-shadow: 0 0 0 3px rgba(130,122,255,.25); }
  button { height: 48px; border: 0; border-radius: 10px; background: var(--v); color: var(--bg); font: 600 16px "Plex Sans", sans-serif; cursor: pointer; transition: background-color 150ms var(--ease), transform 150ms var(--ease); }
  button:hover { background: var(--v3); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--t1); outline-offset: 3px; }
  .err { display: none; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: rgba(255,92,122,.10); border: 1px solid rgba(255,92,122,.45); color: var(--t1); font-size: 14px; }
  .err.on { display: flex; }
  .err::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--crit); }
  footer { margin-top: 20px; text-align: center; font-family: "Plex Mono", monospace; font-size: 12px; letter-spacing: .08em; color: var(--t3); }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/logo-serpent.svg" alt="">
    <h1>Sentinel-X</h1>
    <p>Supervision de la micro-centrale</p>
  </div>
  <form id="f" novalidate>
    <div class="kick">Accès réservé à l'équipe</div>
    <div class="err" id="err" role="alert" aria-live="assertive"></div>
    <label>Identifiant
      <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label>Mot de passe
      <input id="p" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button id="b" type="submit">Se connecter</button>
  </form>
  <footer>SX-2050-G14-001 · la sécurité à la bordure.</footer>
</main>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"), b = document.getElementById("b");
  const show = (msg) => { err.textContent = msg; err.classList.add("on"); };
  document.getElementById("u").focus();
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("on");
    const username = f.username.value.trim(), password = f.password.value;
    if (!username || !password) return show("Renseignez l'identifiant et le mot de passe.");
    b.disabled = true; b.textContent = "Connexion…";
    try {
      const r = await fetch("/api/v1/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }), credentials: "same-origin" });
      if (r.ok) { location.replace("/"); return; }
      const body = await r.json().catch(() => ({}));
      show(body.error || "Connexion impossible.");
      f.password.value = ""; f.password.focus();
    } catch {
      show("Serveur injoignable. Vérifiez le Wi-Fi du site.");
    } finally {
      b.disabled = false; b.textContent = "Se connecter";
    }
  });
</script>
</body>
</html>
